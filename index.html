<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1511" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EBE4DA" media="(prefers-color-scheme: light)">
<meta name="description" content="Coffee brewing calculator and pour timer for V60, French press and cold brew.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brew">
<title>Brew</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#1C1511;
  --raise:#2A1F18;
  --line:#3C2E24;
  --ink:#F4EDE4;
  --muted:#A08F80;
  --signal:#E8A33D;
  --font:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark light;
}
:root[data-theme="light"]{
  --ground:#EBE4DA; --raise:#F6F2EC; --line:#D6CCBE;
  --ink:#241A13; --muted:#6E6054; --signal:#A86A12;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#EBE4DA; --raise:#F6F2EC; --line:#D6CCBE;
    --ink:#241A13; --muted:#6E6054; --signal:#A86A12;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  height:100%;margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--font);font-size:16px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:6px}

.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;
   stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:18px;height:18px}
.i-lg{width:52px;height:52px;stroke-width:1.3}

.wrap{max-width:430px;margin:0 auto;padding:18px 20px 32px;min-height:100%;display:flex;flex-direction:column}

/* method selector */
.methods{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--raise);padding:5px;border-radius:14px}
.methods button{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:11px 3px 9px;border-radius:10px;font-size:12.5px;font-weight:600;
  color:var(--muted);letter-spacing:-.01em;
}
.methods button[aria-pressed="true"]{background:var(--ground);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.methods button[aria-pressed="true"] .i{color:var(--signal)}

/* dose */
.dose{margin-top:24px}
.doseswitch{display:flex;gap:16px;margin-bottom:8px}
.doseswitch button{
  display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;
  color:var(--muted);padding:3px 0 5px;border-bottom:2px solid transparent;
}
.doseswitch button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper input{
  flex:1;min-width:0;background:none;border:0;padding:0;
  font-size:76px;font-weight:600;letter-spacing:-.045em;line-height:1;
}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input[type=number]{-moz-appearance:textfield}
.unit{font-size:24px;font-weight:500;color:var(--muted);margin-left:-8px;align-self:flex-end;padding-bottom:9px}
.bump{display:flex;flex-direction:column;gap:5px}
.bump button{
  width:46px;height:38px;border-radius:10px;background:var(--raise);
  display:flex;align-items:center;justify-content:center;color:var(--ink);
}
.bump button:active{background:var(--line)}

/* result */
.result{
  margin-top:18px;padding:15px 18px;border-radius:14px;background:var(--raise);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.resleft{display:flex;align-items:center;gap:12px;min-width:0}
.resleft .i{color:var(--signal)}
.result .cap{font-size:13px;color:var(--muted);font-weight:500;line-height:1.2}
.result .big{font-size:38px;font-weight:600;letter-spacing:-.04em;line-height:1.05}
.result .big em{font-style:normal;font-size:18px;font-weight:500;color:var(--muted);margin-left:3px}
.result .ratio{font-size:13.5px;color:var(--muted);text-align:right;font-weight:600;flex:none}
.est{margin-top:9px;font-size:12.5px;color:var(--muted);line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.est .i{margin-top:1px}

/* strength */
.strength{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.strength button{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 3px 9px;border-radius:11px;font-size:12.5px;font-weight:600;
  color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);
}
.strength button[aria-pressed="true"]{color:var(--ground);background:var(--signal);box-shadow:none}
:root[data-theme="light"] .strength button[aria-pressed="true"]{color:#FFF8EE}

/* spec rows */
.spec{margin-top:22px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row .k{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted);font-weight:500;flex:none}
.row .v{font-size:15px;font-weight:600;text-align:right}
.row input.v{
  background:none;border:0;padding:5px 8px;max-width:58%;border-radius:8px;
  box-shadow:inset 0 0 0 1px transparent;
}
.row input.v:hover,.row input.v:focus{box-shadow:inset 0 0 0 1px var(--line);outline:none}
.row input.v::placeholder{color:var(--muted);font-weight:500}
.toggle{display:flex;gap:6px}
.toggle button{
  display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
  font-size:13px;font-weight:600;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);
}
.toggle button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}

.note{margin-top:16px;font-size:13px;line-height:1.5;color:var(--muted)}
.note b{color:var(--ink);font-weight:600}

.go{
  margin-top:24px;width:100%;padding:18px;border-radius:14px;
  background:var(--signal);color:#1C1511;font-size:17px;font-weight:700;letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
:root[data-theme="light"] .go{color:#FFF8EE}
.go:active{filter:brightness(.92)}
.spacer{flex:1 1 auto;min-height:12px}
.foot{margin-top:22px;font-size:11.5px;line-height:1.6;color:var(--muted);opacity:.8}
.foot a{color:var(--muted)}

/* cold brew resting card */
.resting{margin-top:18px;padding:17px 18px;border-radius:14px;background:var(--raise);display:flex;gap:14px}
.resting .i-lg{color:var(--signal);width:40px;height:40px}
.resting .when{font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.15}
.resting .sub{font-size:13px;color:var(--muted);margin-top:3px}
.resting button{margin-top:4px;font-size:13px;font-weight:600;color:var(--signal);padding:12px 14px 12px 0;min-height:44px}
.hidden{display:none !important}

/* ---------- brew screen ---------- */
.brew{
  position:fixed;inset:0;background:var(--ground);display:none;
  flex-direction:column;z-index:10;
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
}
.brew.on{display:flex}
.brew.flash{background:var(--line)}
.brewinner{max-width:430px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
.brewtop{display:flex;align-items:center;justify-content:space-between}
.brewtop button{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);padding:10px 14px 10px 0;min-height:44px}
.brewtop button[data-armed]{color:var(--signal)}
.clock{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:var(--muted)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px}
.stephead{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.stephead .i-lg{color:var(--signal)}
.stepname{font-size:20px;font-weight:600;color:var(--signal);letter-spacing:-.01em}
.target{font-size:84px;font-weight:600;letter-spacing:-.05em;line-height:.98}
.target em{font-style:normal;font-size:28px;font-weight:500;color:var(--muted);margin-left:4px}
.stepnote{font-size:16.5px;line-height:1.42;color:var(--ink);max-width:23em;margin-top:8px}
.countdown{font-size:14.5px;font-weight:600;color:var(--muted);margin-top:14px}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:9px;width:100%}
.bar i{display:block;height:100%;background:var(--signal);width:0;border-radius:3px}
.upnext{margin-top:18px;font-size:13px;color:var(--muted);min-height:1.4em;display:flex;align-items:center;gap:7px}
.brewfoot{display:flex;gap:10px;margin-top:16px}
.brewfoot button{
  flex:1;padding:15px;border-radius:13px;font-size:15px;font-weight:600;
  box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.brewfoot button.primary{background:var(--signal);color:#1C1511;box-shadow:none}
:root[data-theme="light"] .brewfoot button.primary{color:#FFF8EE}
.brewfoot button:disabled{opacity:.4;cursor:default}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media (max-height:640px){
  .stepper input{font-size:58px}
  .target{font-size:62px}
  .i-lg{width:40px;height:40px}
}
</style>
</head>

      <button data-input="coffee" aria-pressed="true"><svg class="i i-sm" aria-hidden="true"><use href="#ic-bean"/></svg>Coffee</button>
      <button data-input="water" aria-pressed="false"><svg class="i i-sm" aria-hidden="true"><use href="#ic-drop"/></svg>Water</button>

        </button>
        <button id="down" aria-label="Decrease">
          <svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
        </button>
      </div>
    </div>
  </div>

    <div class="resleft">

      </div>
    </div>
    <div class="row hidden" id="flowRow">
      <span class="k"><svg class="i i-sm" aria-hidden="true"><use href="#ic-flow"/></svg>Basket flow</span>
      <span class="v" id="flowVal">Half open</span>
    </div>
    <div class="row hidden" id="styleRow">
      <span class="k"><svg class="i i-sm" aria-hidden="true"><use href="#ic-serve"/></svg>Serve</span>
      <div class="toggle">
        <button data-style="rtd" aria-pressed="true">Ready to drink</button>
        <button data-style="conc" aria-pressed="false">Concentrate</button>
      </div>
    </div>
  </div>

  <div class="note" id="methodNote"></div>

  <div id="restingCard" class="resting hidden">
    <svg class="i i-lg" aria-hidden="true"><use href="#ic-fridge"/></svg>
    <div>
      <div class="when" id="readyWhen">&mdash;</div>
      <div class="sub" id="readySub"></div>
      <button id="cancelSteep">Discard this batch</button>
    </div>
  </div>

  <button class="go" id="start">
    <svg class="i" aria-hidden="true"><use href="#ic-play"/></svg><span id="startLabel">Start brewing</span>
  </button>

  <div class="spacer"></div>
  <div class="foot" id="credit"></div>
</div>

<div class="brew" id="brewScreen">
 <div class="brewinner">
  <div class="brewtop">
    <button id="exit"><svg class="i i-sm" aria-hidden="true"><use href="#ic-stop"/></svg><span id="exitLabel">Stop</span></button>
    <div class="clock"><svg class="i i-sm" aria-hidden="true"><use href="#ic-clock"/></svg><span id="clock">0:00</span></div>
  </div>
  <div class="stage">
    <div class="stephead">
      <svg class="i i-lg" id="sIcon" aria-hidden="true"><use href="#ic-drop"/></svg>
      <div class="stepname" id="sName">Bloom</div>
    </div>
    <div class="target" id="sTarget">60<em>g</em></div>
    <div class="stepnote" id="sNote"></div>
    <div class="countdown" id="sCount"></div>
    <div class="bar"><i id="sBar"></i></div>
    <div class="upnext" id="sNext"></div>
  </div>
  <div class="brewfoot">
    <button id="pause"><svg class="i i-sm" aria-hidden="true"><use href="#ic-pause"/></svg><span id="pauseLabel">Pause</span></button>
    <button id="skip" class="primary"><svg class="i i-sm" aria-hidden="true"><use href="#ic-next"/></svg>Next step</button>
  </div>
 </div>
</div>

<script>
"use strict";

/* ---------------------------------------------------------------
   Recipe sources
   V60 and French press: James Hoffmann's published techniques.
   Cold brew: Hoffmann's own posted recipe (75 g/L, fine grind, 12 h fridge).
   Concentrate mode (1:8) is NOT his and is flagged as a guess in the UI.
   Strength steps move the ratio by +/-10%, the SCA Golden Cup tolerance.
   Verify any of this against the original source before trusting it.
--------------------------------------------------------------- */
var CREDIT_HOT = "V60 and French press: James Hoffmann's published methods. Strength range follows the SCA Golden Cup tolerance of 55 g/L \u00B110%. Check the originals before you rely on these numbers.";
var CREDIT_MOCCA = "Flow settings, temperature and minimum batch from Technivorm's own manual and support pages. The bloom-and-stir technique follows Sample Coffee's published Moccamaster guide. Technivorm's older manual and its current support page disagree slightly on the cup thresholds \u2014 the app follows the current page.";
var CREDIT_COLD = "Ratio and steep time from James Hoffmann's own posted cold brew recipe. Concentrate mode is not his \u2014 1:8 is a common starting point, so treat it as a guess and adjust to taste.";

var R = {
  v60:{
    label:"V60", icon:"ic-v60", ratio:16.67, temp:"95\u00B0C", grind:"Medium-fine",
    total:"about 3:30", defaultDose:30, timed:true, credit:CREDIT_HOT,
    note:"<b>Hoffmann's V60.</b> Rinse the filter, level the bed, make a small well in the middle. Pour targets are cumulative \u2014 pour until the scale reads that number.",
    steps:function(c,w){ return [
      {name:"Bloom", icon:"ic-drop", target:Math.round(c*2), dur:45,
       note:"Pour into the centre, then swirl until there are no dry grounds."},
      {name:"First pour", icon:"ic-pour", target:Math.round(w*0.6), dur:30,
       note:"Concentric circles, steady, over about 30 seconds."},
      {name:"Second pour", icon:"ic-pour", target:Math.round(w), dur:30,
       note:"Keep the cone full. Finish pouring by 1:45."},
      {name:"Stir", icon:"ic-stir", target:null, dur:10,
       note:"One stir clockwise, one anticlockwise."},
      {name:"Swirl", icon:"ic-swirl", target:null, dur:10,
       note:"Gentle swirl to settle the bed flat."},
      {name:"Drawdown", icon:"ic-wait", target:null, dur:85,
       note:"Leave it alone. Aim to finish around 3:30."}
    ];}
  },
  press:{
    label:"French press", icon:"ic-press", ratio:16.67, temp:"94\u00B0C", grind:"Medium",
    total:"about 10 min", defaultDose:30, timed:true, credit:CREDIT_HOT,
    note:"<b>Hoffmann's French press.</b> Medium grind, not coarse. The long settle and the shallow plunge are what keep the cup clean \u2014 don't press to the bottom.",
    steps:function(c,w){ return [
      {name:"Steep", icon:"ic-pour", target:Math.round(w), dur:240,
       note:"Pour all the water in steadily. Then don't touch it."},
      {name:"Break the crust", icon:"ic-stir", target:null, dur:60,
       note:"Two or three slow stirs, then skim off the foam and floating grounds."},
      {name:"Let it settle", icon:"ic-wait", target:null, dur:300,
       note:"Fines sink to the bottom. The longer you wait, the cleaner the cup."},
      {name:"Plunge to the surface", icon:"ic-plunge", target:null, dur:20,
       note:"Rest the mesh on top of the liquid. Pour gently and stop before the sludge."}
    ];}
  },
  mocca:{
    label:"Moccamaster", icon:"ic-mocca", ratio:16, temp:"92\u201396\u00B0C (automatic)", grind:"Medium-coarse",
    total:"about 6 min", defaultDose:50, timed:true, credit:CREDIT_MOCCA,
    note:"<b>Moccamaster, bloomed.</b> Grounds in the filter, water in the tank, basket set to <b>closed</b>. The machine handles temperature on its own \u2014 the only things you control are the dose, the grind and the basket flow.",
    steps:function(c,w){ return [
      {name:"Bloom", icon:"ic-drop", target:null, dur:25,
       note:"Switch on with the basket closed. Let it fill about halfway, then switch off."},
      {name:"Stir", icon:"ic-stir", target:null, dur:20,
       note:"Stir gently until every ground is wet. Don't tear the paper."},
      {name:"Open the basket", icon:"ic-flow", target:null, dur:10,
       note:"Set the flow to " + flowFor(Math.round(w)).toLowerCase() + ", then switch the machine back on."},
      {name:"Brewing", icon:"ic-wait", target:null, dur:300,
       note:"Four to six minutes. Leave it alone \u2014 but open the flow fully if the basket looks close to overflowing."},
      {name:"Swirl and serve", icon:"ic-swirl", target:null, dur:15,
       note:"Swirl the carafe to mix the layers before you pour."}
    ];}
  },
  cold:{
    label:"Cold brew", icon:"ic-cold", ratio:13.3, temp:"Room temperature", grind:"Fine (moka pot)",
    total:"12 hours", defaultDose:75, timed:false, steepHours:12, credit:CREDIT_COLD,
    note:"<b>Hoffmann's cold brew.</b> Ground fine, not coarse. Stir hard so nothing clumps, lid on, into the fridge. Decant off the top and stop before the sediment \u2014 no filtering needed."
  }
};

var S = {
  method:"v60", inputMode:"coffee", amount:30, strength:"normal",
  scale:"on", coldStyle:"rtd", grind:{}, dose:{}, coldStart:null
};

function load(){
  try{
    var raw = localStorage.getItem("brew.v1");
    if(raw){ var o = JSON.parse(raw); for(var k in o){ if(k in S) S[k] = o[k]; } }
  }catch(e){}
  if(!S.grind || typeof S.grind !== "object") S.grind = {};
  if(!S.dose  || typeof S.dose  !== "object") S.dose  = {};
}
function save(){ try{ localStorage.setItem("brew.v1", JSON.stringify(S)); }catch(e){} }

var MULT = {light:1.1, normal:1, strong:1/1.1};
function ratio(){
  var r = (S.method === "cold" && S.coldStyle === "conc") ? 8 : R[S.method].ratio;
  return r * MULT[S.strength];
}
function coffee(){ return S.inputMode === "coffee" ? S.amount : S.amount / ratio(); }
function water(){  return S.inputMode === "coffee" ? S.amount * ratio() : S.amount; }
function fmt(n){ return n >= 100 ? Math.round(n) : Math.round(n*10)/10; }
/* Technivorm: fully open for a full carafe (about 7 cups and up),
   half open for 4-6 cups, which slows the drip for more contact time.
   A Moccamaster "cup" is 125 ml on a 1.25 L carafe. */
function flowFor(w){ return w >= 875 ? "Fully open" : "Half open"; }
/* Whole lines only when the water is within 10 ml above one, so the tank hint
   never says "line 7" while the flow row still says half open. */
function tankLine(ml){
  var line = ml/125, lo = Math.floor(line);
  return line - lo < 0.08 ? "roughly line " + lo : "between lines " + lo + " and " + (lo+1);
}
function mmss(sec){ sec = Math.max(0, Math.round(sec)); return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0"); }

var $ = function(id){ return document.getElementById(id); };
function setIcon(el, id){ el.innerHTML = '<use href="#' + id + '"/>'; }
function press(sel, attr, val){
  document.querySelectorAll(sel).forEach(function(b){
    b.setAttribute("aria-pressed", b.dataset[attr] === val ? "true" : "false");
  });
}

function render(){
  var m = R[S.method];

  press(".methods button","m",S.method);
  press(".doseswitch button","input",S.inputMode);
  press(".strength button","s",S.strength);
  press("[data-scale]","scale",S.scale);
  press("[data-style]","style",S.coldStyle);

  if(document.activeElement !== $("amount")) $("amount").value = fmt(S.amount);

  var showingWater = S.inputMode === "coffee";
  $("outLabel").textContent = showingWater ? "Water" : "Coffee";
  setIcon($("outIcon"), showingWater ? "ic-drop" : "ic-bean");
  $("outVal").textContent = fmt(showingWater ? water() : coffee());
  $("ratioOut").textContent = "1:" + (Math.round(ratio()*10)/10);

  $("grind").value = S.grind[S.method] || "";
  $("grind").placeholder = m.grind;
  $("temp").textContent = m.temp;
  $("timeKey").textContent = m.timed ? "Takes" : "Steep";
  $("totalTime").textContent = m.total;
  $("methodNote").innerHTML = m.note;
  $("credit").textContent = m.credit;
  $("styleRow").classList.toggle("hidden", S.method !== "cold");
  $("flowRow").classList.toggle("hidden", S.method !== "mocca");
  if(S.method === "mocca") $("flowVal").textContent = flowFor(Math.round(water()));

  var warn = "";
  if(S.method === "mocca"){
    var w = Math.round(water());
    if(w > 1250) warn = "That is more than a 1.25 L carafe holds. Split it into two brews.";
    else if(w < 500) warn = "Technivorm suggests at least four cups in an 8\u201310 cup brewer \u2014 below about 500 ml the shower head struggles to wet the bed evenly, so the stir matters more.";
    else warn = "Tank fills to " + tankLine(w) + ". Markings vary by model, so check yours.";
  }
  $("warning").classList.toggle("hidden", !warn);
  $("warnText").textContent = warn;

  if(S.scale === "off"){
    $("estimate").classList.remove("hidden");
    $("estText").textContent =
      "About " + (Math.round(coffee()/5*2)/2) + " level tablespoons of grounds and " +
      Math.round(water()) + " ml of water. Tablespoon weight shifts with grind and roast, so this is an estimate, not a measurement.";
  }else{
    $("estimate").classList.add("hidden");
  }

  var resting = S.method === "cold" && S.coldStart;
  $("restingCard").classList.toggle("hidden", !resting);
  if(resting) renderResting();
  setStartLabel();
}

/* While a steep is still running there is only one batch to track, so the
   button says it restarts it rather than promising a second batch. */
function steepLeft(){ return S.coldStart ? S.coldStart + R.cold.steepHours*3600*1000 - Date.now() : 0; }
function restarting(){ return !R[S.method].timed && !!S.coldStart && steepLeft() > 0; }
function setStartLabel(){
  if($("start").dataset.armed !== undefined) return;
  var m = R[S.method];
  $("startLabel").textContent = m.timed ? "Start brewing"
    : !S.coldStart ? "Start the steep"
    : restarting() ? "Restart the steep" : "Start another batch";
}

function renderResting(){
  var ready = S.coldStart + R.cold.steepHours*3600*1000;
  var left = steepLeft();
  var d = new Date(ready);
  var hh = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  if(left <= 0){
    $("readyWhen").textContent = "Ready now";
    $("readySub").textContent = "Decant it off the sediment and keep it cold.";
  }else{
    var sameDay = d.toDateString() === new Date().toDateString();
    $("readyWhen").textContent = "Ready at " + hh;
    $("readySub").textContent = (sameDay ? "Today" : "Tomorrow") + ", " +
      Math.floor(left/3600000) + "h " + Math.floor(left%3600000/60000) + "m from now.";
  }
}

/* ---------------- home events ---------------- */
document.querySelectorAll(".methods button").forEach(function(b){
  b.addEventListener("click", function(){
    S.dose[S.method] = Math.round(coffee()*10)/10;
    S.method = b.dataset.m;
    S.inputMode = "coffee";
    S.amount = S.dose[S.method] || R[S.method].defaultDose;
    save(); render();
  });
});
document.querySelectorAll(".doseswitch button").forEach(function(b){
  b.addEventListener("click", function(){
    var mode = b.dataset.input;
    if(mode === S.inputMode) return;
    S.amount = Math.round((mode === "coffee" ? coffee() : water())*10)/10;
    S.inputMode = mode;
    save(); render();
  });
});
document.querySelectorAll(".strength button").forEach(function(b){
  b.addEventListener("click", function(){ S.strength = b.dataset.s; save(); render(); });
});
document.querySelectorAll("[data-scale]").forEach(function(b){
  b.addEventListener("click", function(){ S.scale = b.dataset.scale; save(); render(); });
});
document.querySelectorAll("[data-style]").forEach(function(b){
  b.addEventListener("click", function(){ S.coldStyle = b.dataset.style; save(); render(); });
});
$("amount").addEventListener("input", function(){
  var v = parseFloat(this.value);
  if(!isNaN(v) && v > 0){ S.amount = v; save(); render(); }
});
$("amount").addEventListener("blur", render);
function bump(dir){
  var step = S.inputMode === "coffee" ? 1 : 10;
  S.amount = Math.max(1, Math.round((S.amount + dir*step)*10)/10);
  save(); render();
}
$("up").addEventListener("click", function(){ bump(1); });
$("down").addEventListener("click", function(){ bump(-1); });
$("grind").addEventListener("change", function(){ S.grind[S.method] = this.value.trim(); save(); });
$("cancelSteep").addEventListener("click", function(){
  if(!confirmTap(this, this, "Tap again to discard")) return;
  S.coldStart = null; save(); render();
});

/* Two-tap confirm for actions that can't be undone: the first tap swaps the
   label, a second tap within 3 s goes ahead. No modal. */
function confirmTap(btn, label, prompt){
  if(btn.dataset.armed !== undefined){ disarm(btn, label); return true; }
  btn.dataset.armed = label.textContent;
  label.textContent = prompt;
  btn._disarm = setTimeout(function(){ disarm(btn, label); }, 3000);
  return false;
}
function disarm(btn, label){
  if(btn.dataset.armed === undefined) return;
  clearTimeout(btn._disarm);
  label.textContent = btn.dataset.armed;
  delete btn.dataset.armed;
}

/* ---------------- brew timer ---------------- */
var T = {steps:[], total:0, start:0, paused:false, pausedAt:0, timer:null, lock:null, last:-1, finished:false, flashOff:null};

/* One shared AudioContext. Safari only lets a context start inside a tap, so
   it is created and resumed from taps (Start, and any tap on the brew screen)
   and the timer's beeps reuse it. A new context per beep, made from the timer,
   stays silent on iPhone. iOS also mutes Web Audio when the ringer switch is
   on silent, so every step change flashes the screen too, and vibrates where
   the browser supports it (Android). */
var AC = null;
function unlockAudio(){
  try{
    if(!AC){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(Ctx) AC = new Ctx();
    }
    if(AC && AC.state !== "running"){
      var p = AC.resume();
      if(p && p.catch) p.catch(function(){});
    }
  }catch(e){}
}
function beep(){
  try{
    if(!AC) return;
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.start(t); o.stop(t + 0.32);
  }catch(e){}
}
function cue(){
  beep();
  try{ if(navigator.vibrate) navigator.vibrate(200); }catch(e){}
  $("brewScreen").classList.add("flash");
  clearTimeout(T.flashOff);
  T.flashOff = setTimeout(function(){ $("brewScreen").classList.remove("flash"); }, 1200);
}

function wantAwake(){ return $("brewScreen").classList.contains("on") && !T.paused && !T.finished; }
function keepAwake(){
  try{
    if(!("wakeLock" in navigator) || T.lock) return;
    navigator.wakeLock.request("screen").then(function(l){
      /* Stop, Pause or the end of the brew can land before the request does. */
      if(!wantAwake() || T.lock){ l.release(); return; }
      T.lock = l;
      l.addEventListener("release", function(){ if(T.lock === l) T.lock = null; });
    }).catch(function(){});
  }catch(e){}
}
function releaseAwake(){ try{ if(T.lock){ T.lock.release(); T.lock = null; } }catch(e){} }
function elapsed(){ return (T.paused ? T.pausedAt : Date.now() - T.start)/1000; }

function startBrew(){
  var m = R[S.method];
  if(!m.timed){ S.coldStart = Date.now(); save(); render(); return; }

  T.steps = m.steps(coffee(), water());
  var acc = 0;
  T.steps.forEach(function(s){ s.at = acc; acc += s.dur; });
  T.total = acc;
  T.start = Date.now(); T.paused = false; T.last = -1; T.finished = false;
  $("pauseLabel").textContent = "Pause";
  disarm($("exit"), $("exitLabel"));
  $("exitLabel").textContent = "Stop";
  $("pause").disabled = $("skip").disabled = false;
  $("brewScreen").classList.add("on");
  unlockAudio(); keepAwake(); beep();
  if(T.timer) clearInterval(T.timer);
  T.timer = setInterval(tick, 120);
  tick();
}

function tick(){
  var e = elapsed(), idx = 0;
  for(var i = 0; i < T.steps.length; i++){ if(e >= T.steps[i].at) idx = i; }
  var s = T.steps[idx];

  if(idx !== T.last){
    if(T.last !== -1) cue();
    T.last = idx;
    $("sName").textContent = s.name;
    $("sNote").textContent = s.note;
    setIcon($("sIcon"), s.icon);
    $("sTarget").innerHTML = s.target !== null ? (s.target + "<em>g</em>") : "&mdash;";
    var n = T.steps[idx+1];
    $("sNext").innerHTML = n
      ? '<svg class="i i-sm" aria-hidden="true"><use href="#ic-next"/></svg>' + n.name + (n.target !== null ? " to " + n.target + " g" : "")
      : '<svg class="i i-sm" aria-hidden="true"><use href="#ic-done"/></svg>Last step';
  }

  $("clock").textContent = mmss(e);
  var into = e - s.at;
  $("sCount").textContent = e >= T.total ? "Brew complete" : (mmss(s.dur - into) + " left in this step");
  $("sBar").style.width = Math.min(100, Math.max(0, into/s.dur*100)) + "%";

  if(e >= T.total && !T.finished){
    /* Freeze on Done and let the screen sleep; Close returns home. */
    T.finished = true;
    clearInterval(T.timer); T.timer = null;
    releaseAwake();
    $("clock").textContent = mmss(T.total);
    setIcon($("sIcon"), "ic-done");
    $("sName").textContent = "Done";
    disarm($("exit"), $("exitLabel"));
    $("exitLabel").textContent = "Close";
    $("pause").disabled = $("skip").disabled = true;
    cue();
  }
}

function stopBrew(){
  if(T.timer){ clearInterval(T.timer); T.timer = null; }
  $("brewScreen").classList.remove("on");
  releaseAwake();
}

$("start").addEventListener("click", function(){
  if(restarting() && !confirmTap(this, $("startLabel"), "Tap again to restart")) return;
  startBrew();
});
$("exit").addEventListener("click", function(){
  if(T.finished || confirmTap(this, $("exitLabel"), "Tap again to stop")) stopBrew();
});
/* Capture phase, so the context is running before a tap's own handler beeps. */
$("brewScreen").addEventListener("click", unlockAudio, true);
$("pause").addEventListener("click", function(){
  if(T.finished) return;
  if(T.paused){
    T.start = Date.now() - T.pausedAt; T.paused = false;
    $("pauseLabel").textContent = "Pause"; keepAwake();
  }else{
    T.pausedAt = Date.now() - T.start; T.paused = true;
    $("pauseLabel").textContent = "Resume"; releaseAwake();
  }
});
$("skip").addEventListener("click", function(){
  var e = elapsed(), idx = 0;
  for(var i = 0; i < T.steps.length; i++){ if(e >= T.steps[i].at) idx = i; }
  var n = T.steps[idx+1];
  if(!n) return;
  /* Whole milliseconds: a fractional shift can land a hair short of the next
     step, and while paused nothing would move it on. */
  var ms = T.paused ? T.pausedAt : Date.now() - T.start;
  var shift = n.at*1000 - ms;
  T.start -= shift;
  if(T.paused) T.pausedAt += shift;
  tick();
});
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && wantAwake()) keepAwake();
});
document.addEventListener("keydown", function(ev){
  if(!$("brewScreen").classList.contains("on")) return;
  if(ev.key === "Escape") stopBrew();
  if(ev.key === " "){ ev.preventDefault(); $("pause").click(); }
});

/* ---------------- boot ---------------- */
load();
render();
setInterval(function(){ if(S.method === "cold" && S.coldStart){ renderResting(); setStartLabel(); } }, 30000);

if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
